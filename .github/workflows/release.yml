name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: :desktopApp:packageDeb
            artifact: desktopApp/build/compose/binaries/**/*.deb
          - os: macos-latest
            task: :desktopApp:packageDmg
            artifact: desktopApp/build/compose/binaries/**/*.dmg
          - os: windows-latest
            task: :desktopApp:packageReleaseMsi
            artifact: desktopApp/build/compose/binaries/**/*.msi

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew.bat ${{ matrix.task }} --stacktrace
          else
            ./gradlew ${{ matrix.task }} --stacktrace
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortX-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release
        run: ./gradlew :androidApp:assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortX-Android
          path: androidApp/build/outputs/apk/release/*.apk

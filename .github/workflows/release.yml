name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v5.3.0)'
        required: false
        default: 'v5.3.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Windows MSI Package
        run: ./gradlew.bat :desktopApp:packageMsi --stacktrace

      - name: Locate and Stage Windows MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged-artifacts
          $msi = Get-ChildItem -Path desktopApp/build -Recurse -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item -Path $msi.FullName -Destination staged-artifacts/
            Write-Host "Staged MSI: $($msi.FullName)"
          } else {
            Write-Error "Windows MSI installer was not found in desktopApp/build directory."
          }

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: staged-artifacts/*.msi

  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB Package
        run: ./gradlew :desktopApp:packageDeb --stacktrace

      - name: Locate and Stage Linux DEB
        run: |
          mkdir -p staged-artifacts
          find desktopApp/build -name "*.deb" -exec cp {} staged-artifacts/ \;

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: staged-artifacts/*.deb

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK Platform 37 and licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37" || true
          fi
        shell: bash

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Locate and Stage Android APK
        run: |
          mkdir -p staged-artifacts
          find androidApp/build/outputs/apk -name "*.apk" -exec cp {} staged-artifacts/ \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: staged-artifacts/*.apk

  publish-release:
    name: Publish GitHub Release with Multiplatform Binaries
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: release-binaries/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-binaries/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-binaries/

      - name: Display Release Binaries
        run: ls -la release-binaries/

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG_FOUND=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG_FOUND=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "PortX ${{ github.ref_name || inputs.tag_name }} - Ultra Engine v5 & Declarative Signatures"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: release-binaries/*
